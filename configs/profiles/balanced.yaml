# ============================================================
# Profile: balanced
# Best for: most production use cases — good quality with reasonable resource use
# ============================================================

app:
  name: local-rag

# ── Infrastructure ──────────────────────────────────────────

llm:
  provider: ollama
  model: llama3
  base_url: http://ollama:11434
  temperature: 0.7
  max_tokens: 1024

embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5
  dimensions: 384

vector_store:
  provider: qdrant
  mode: local
  host: qdrant
  port: 6333
  collection: documents
  # api_key: null  # required only when mode: cloud

# ── Ingestion Pipeline ──────────────────────────────────────

ingestion:
  source_type: [pdf, docx, pptx, html, markdown]
  parsing_strategy: structured
  deduplication: true
  allowed_base_dir: /data

chunking:
  strategy: recursive
  chunk_size: 500
  overlap: 50
  separators: ["\n\n", "\n", ". ", " ", ""]

# ── Retrieval Pipeline ──────────────────────────────────────

retrieval:
  strategy: vector
  top_k: 10

reranking:
  enabled: true
  method: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

# ── Query Processing Pipeline ───────────────────────────────
# Only query rewriting is enabled — a lightweight improvement with minimal overhead.

query_processing:
  rewriting:
    enabled: true
  expansion:
    enabled: false
  hyde:
    enabled: false
  multi_query:
    enabled: false
    num_variants: 3
  decomposition:
    enabled: false
    max_subqueries: 4
  step_back:
    enabled: false
