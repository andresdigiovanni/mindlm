# ============================================================
# Profile: full
# Best for: maximum retrieval quality — higher resource requirements
# Note: semantic chunking downloads the embedding model on first run.
#       All query processors are enabled and run in parallel.
# ============================================================

# ── Infrastructure ──────────────────────────────────────────

llm:
  provider: ollama
  model: gemma4
  base_url: http://ollama:11434
  temperature: 0.7
  max_tokens: 2048

embeddings:
  provider: huggingface
  model: BAAI/bge-large-en-v1.5
  dimensions: 1024

vector_store:
  provider: qdrant
  mode: local
  host: qdrant
  port: 6333
  collection: documents
  # api_key: null  # required only when mode: cloud

# ── Ingestion Pipeline ──────────────────────────────────────

ingestion:
  source_type: [pdf, docx, pptx, html, markdown, png, jpeg]
  parsing_strategy: structured
  deduplication: true
  allowed_base_dir: /data

chunking:
  strategy: semantic
  chunk_size: 500
  overlap: 50
  semantic_model: BAAI/bge-large-en-v1.5  # must match embeddings.model
  # parent_chunk_size: 1500  # optional: enable parent-document retrieval
  # window_size: 2  # used only when strategy: sentence_window

# ── Retrieval Pipeline ──────────────────────────────────────

retrieval:
  strategy: hybrid
  top_k: 10
  # score_threshold: 0.6  # optional: drop results below this similarity score

reranking:
  enabled: true
  method: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # method: llm          # LLM-based 1-10 scoring (requires llm config)
  # method: compression  # Contextual compression - extracts relevant parts only

# ── Contextual Retrieval (opt-in) ───────────────────────────
# Stores LLM-generated metadata at ingest time. Raw chunk text is always embedded
# unchanged; context and summary appear in search result metadata only.
# chunk_context_enabled: 1 LLM call per chunk → payload["chunk_context"]
# document_summary_enabled: 1 LLM call per document → payload["document_summary"]
contextual_retrieval:
  chunk_context_enabled: true
  document_summary_enabled: true
  max_workers: 8

# ── Query Processing Pipeline ───────────────────────────────
# All processors enabled — each generates additional query variants
# that are merged and deduplicated before retrieval.

query_processing:
  rewriting:
    enabled: true
  expansion:
    enabled: true
  hyde:
    enabled: true
  multi_query:
    enabled: true
    num_variants: 3
  decomposition:
    enabled: true
    max_subqueries: 4
  step_back:
    enabled: true
  planner:            # adaptive LLM planner: selects which processors to run per query
    enabled: true     # when true, LLM classifies each query and picks the optimal processor subset

# ── Observability ────────────────────────────────────────────

observability:
  public_key: pk-lf-local-dev
  secret_key: sk-lf-local-dev
  host: http://langfuse:3000   # use http://localhost:3000 outside Docker
  flush_at: 15
  flush_interval: 0.5

# ── GraphRAG (opt-in) ────────────────────────────────────────────────────────
# Knowledge-graph-augmented retrieval. At ingest time, entities and relationships
# are extracted from each chunk and stored in a graph DB. At query time, the graph
# is traversed to expand vector search results with related context.
# Set "enabled: true" to activate. Neo4j must be running (included in docker-compose.yml).

graph_rag:
  enabled: false
  store:
    provider: neo4j
    host: neo4j
    port: 7687
    username: neo4j
    password: neo4j_password
