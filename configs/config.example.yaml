app:
  name: local-rag

llm:
  provider: ollama
  model: llama3
  base_url: http://ollama:11434

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2
  dimensions: 384

vector_store:
  provider: qdrant
  mode: local
  host: qdrant
  port: 6333
  collection: documents

ingestion:
  source_type:
    - pdf
    - markdown
    - html
    - png
    - jpeg
    - pptx
    - docx
  parsing_strategy: structured
  deduplication: true
  allowed_base_dir: /data

chunking:
  strategy: semantic
  chunk_size: 500
  overlap: 50
  semantic_model: sentence-transformers/all-MiniLM-L6-v2
  parent_chunk_size: null     # int > chunk_size, or null to disable parent-doc mode
  separators:                 # used only when strategy: recursive
    - "\n\n"
    - "\n"
    - ". "
    - " "
    - ""

retrieval:
  strategy: hybrid
  top_k: 5

reranking:
  enabled: false
  method: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

query_processing:
  rewriting:
    enabled: false
  expansion:
    enabled: false
  hyde:
    enabled: false
  multi_query:
    enabled: false
    num_variants: 3
  decomposition:
    enabled: false
    max_subqueries: 4
  step_back:
    enabled: false
