# ============================================================
# mindlm — Example Configuration
# ============================================================
# Copy this file to configs/config.yaml and edit as needed.
#
#   cp configs/config.example.yaml configs/config.yaml
#
# Or generate one interactively:
#
#   ./config-wizard.sh
#   # or: bash mindlm.sh config-wizard
#
# Ready-to-use presets (copy directly to configs/config.yaml):
#   configs/profiles/minimal.yaml   — quick start, low resource
#   configs/profiles/balanced.yaml  — recommended default
#   configs/profiles/full.yaml      — maximum quality, higher resource use
# ============================================================

# ── Infrastructure ──────────────────────────────────────────
# Core services: LLM provider, embedding model, and vector store.

llm:
  provider: ollama           # currently only "ollama" is supported
  model: gemma4              # any model pulled in Ollama (e.g. mistral, gemma2)
  base_url: http://ollama:11434  # use http://localhost:11434 for local dev outside Docker
  temperature: 0.7           # 0.0 = deterministic, 1.0 = creative
  max_tokens: 1024           # maximum tokens in the generated answer

embeddings:
  provider: huggingface      # currently only "huggingface" is supported
  model: BAAI/bge-small-en-v1.5  # HuggingFace model id; downloaded on first run
  dimensions: 384            # must match the output dimension of the model above

vector_store:
  provider: qdrant           # currently only "qdrant" is supported
  mode: local                # "local" = self-hosted Qdrant; "cloud" = Qdrant Cloud
  host: qdrant               # Docker service name; use "localhost" outside Docker
  port: 6333
  collection: documents      # Qdrant collection name; created automatically if absent
  # api_key: null            # required when mode: cloud (set via env var recommended)

# ── Ingestion Pipeline ──────────────────────────────────────
# Controls how documents are loaded, parsed, split, and indexed.

ingestion:
  source_type: [pdf, docx, markdown]  # accepted file extensions
  parsing_strategy: raw      # raw = plain text; structured = layout-aware; ocr = image/scan
  deduplication: true        # skip re-indexing documents with identical content hash
  allowed_base_dir: /data    # security boundary: only files under this path can be ingested

chunking:
  strategy: recursive        # fixed | recursive | sliding | semantic
  chunk_size: 512            # target chunk size in characters
  overlap: 64                # overlap between consecutive chunks (0 for fixed strategy)
  separators: ["\n\n", "\n", ". ", " ", ""]  # used only by recursive strategy; tried in order
  # semantic_model: BAAI/bge-small-en-v1.5  # required when strategy: semantic
  # parent_chunk_size: 1500  # optional: store parent chunks for context-aware retrieval
  #                          # must be greater than chunk_size

# ── Retrieval Pipeline ──────────────────────────────────────
# Controls how indexed chunks are retrieved and optionally re-ranked.

retrieval:
  strategy: vector           # vector = dense similarity; hybrid = dense + sparse (BM25)
  top_k: 5                   # number of chunks returned before reranking
  # score_threshold: 0.6    # optional: drop results below this similarity score (0.0–1.0)

reranking:
  enabled: false             # set to true to re-score retrieved chunks
  # method: cross_encoder    # cross_encoder | mmr
  # model: cross-encoder/ms-marco-MiniLM-L-6-v2  # required when method: cross_encoder

# ── Contextual Retrieval (opt-in) ───────────────────────────
# Stores LLM-generated metadata at ingest time. Raw chunk text is always embedded
# unchanged; context and summary appear in search result metadata only.
# chunk_context_enabled: 1 LLM call per chunk → payload["chunk_context"]
# document_summary_enabled: 1 LLM call per document → payload["document_summary"]
contextual_retrieval:
  chunk_context_enabled: true  # situational context sentence per chunk
  document_summary_enabled: true  # one-sentence summary per document (cheap)

# ── Query Processing Pipeline ───────────────────────────────
# Optional query transformations applied before retrieval.
# All processors are independent and can be combined freely.
# Enabled processors run in parallel; results are merged and deduplicated.

query_processing:
  rewriting:               # rephrase the query for better retrieval
    enabled: false
  expansion:               # add synonyms and related terms
    enabled: false
  hyde:                    # generate a hypothetical document to guide retrieval
    enabled: false
  multi_query:             # generate N query variants and merge results
    enabled: false
    num_variants: 3        # 2–10
  decomposition:           # split complex queries into sub-queries
    enabled: false
    max_subqueries: 4      # 2–10
  step_back:               # generate a broader "step-back" question first
    enabled: false
  planner:               # adaptive LLM planner: selects which processors to run per query
    enabled: false       # when true, LLM classifies each query and picks the optimal processor subset

# ── Iterative / Agentic Retrieval (opt-in) ──────────────────
# Enables a grounding-check loop after each generate step.
# The LLM evaluates whether the answer is supported by retrieved context.
# If not grounded and a refined query is suggested, retrieval is retried.
# Results are accumulated and deduplicated across all iterations.
iterative_retrieval:
  enabled: false             # set to true to activate the loop
  max_iterations: 3          # 1–5; loop exits early if answer is grounded

# ── Observability ────────────────────────────────────────────
# Optional Langfuse tracing for the full RAG pipeline.
# Start self-hosted Langfuse: docker compose --profile langfuse up
# Then open http://localhost:3000 (admin@example.com / changeme)
# For Langfuse Cloud: set host to https://cloud.langfuse.com

observability:
  public_key: pk-lf-local-dev  # Langfuse project public key
  secret_key: sk-lf-local-dev  # Langfuse project secret key
  host: http://langfuse:3000   # Langfuse host; use http://localhost:3000 outside Docker
  flush_at: 15                 # events batched before sending
  flush_interval: 0.5          # max seconds before flushing a batch
