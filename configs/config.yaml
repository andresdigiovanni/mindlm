# Main runtime configuration for MindLM.
# Mounted in containers as /config/config.yaml.

llm:
  provider: ollama
  model: gemma4
  base_url: http://ollama:11434
  temperature: 0.7
  max_tokens: 2048

embeddings:
  provider: huggingface
  model: BAAI/bge-large-en-v1.5
  dimensions: 1024

vector_store:
  provider: qdrant
  mode: local
  host: qdrant
  port: 6333
  collection: documents
  # api_key: null  # required only when mode: cloud

# ── Ingestion Pipeline ──────────────────────────────────────

ingestion:
  source_type: [pdf, docx, pptx, html, markdown, png, jpeg]
  parsing_strategy: structured
  deduplication: true
  allowed_base_dir: /data

chunking:
  strategy: semantic
  chunk_size: 500
  overlap: 50
  semantic_model: BAAI/bge-large-en-v1.5
  parent_chunk_size: 1500
  # window_size: 2  # used only when strategy: sentence_window

# ── Contextual Retrieval (opt-in) ───────────────────────────
# Stores LLM-generated metadata at ingest time. Raw chunk text is always embedded
# unchanged; context and summary appear in search result metadata only.
# chunk_context_enabled: 1 LLM call per chunk → payload["chunk_context"]
# document_summary_enabled: 1 LLM call per document → payload["document_summary"]
contextual_retrieval:
  chunk_context_enabled: false
  document_summary_enabled: true

# ── Retrieval Pipeline ──────────────────────────────────────

retrieval:
  strategy: hybrid
  per_query_top_k: 20
  top_k: 40

reranking:
  enabled: true
  method: cross_encoder
  model: BAAI/bge-reranker-v2-m3
  top_k: 10
  score_threshold: 0.1

compression:
  enabled: false

# ── Query Processing Pipeline ───────────────────────────────
# All processors enabled — each generates additional query variants
# that are merged and deduplicated before retrieval.

query_processing:
  rewriting:
    enabled: true
  expansion:
    enabled: true
  hyde:
    enabled: true
  multi_query:
    enabled: true
    num_variants: 3
  decomposition:
    enabled: true
    max_subqueries: 4
  step_back:
    enabled: true
  planner:            # adaptive LLM planner: selects which processors to run per query
    enabled: true     # when true, LLM classifies each query and picks the optimal subset

# ── Iterative / Agentic Retrieval (opt-in) ──────────────────
# Enables a grounding-check loop after each generate step.
# The LLM evaluates whether the answer is supported by retrieved context.
# If not grounded and a refined query is suggested, retrieval is retried.
# Results are accumulated and deduplicated across all iterations.
iterative_retrieval:
  enabled: false             # set to true to activate the loop
  max_iterations: 3          # 1–5; loop exits early if answer is grounded

# ── Observability ────────────────────────────────────────────

observability:
  enabled: true
  public_key: pk-lf-local-dev
  secret_key: sk-lf-local-dev
  host: http://langfuse:3000   # use http://localhost:3000 outside Docker
  flush_at: 15
  flush_interval: 0.5
