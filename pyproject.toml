[project]
name = "mindlm"
version = "0.1.0"
description = "A Python project with cookiecutter structure"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.3",
    "qdrant-client[fastembed]>=1.12",
    "sentence-transformers>=3.3",
    "torch>=2.3",
    "httpx>=0.28",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "surya-ocr>=0.7",
]
authors = [
    {name = "Andres Di Giovanni", email = "andresdigiovanni@gmail.com"}
]
maintainers = [
    {name = "Andres Di Giovanni", email = "andresdigiovanni@gmail.com"}
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "tox>=4.0.0",
    "tox-uv>=1.0.0",
    "commitizen>=4.9.1",
    "ruff>=0.6.9",
    "mypy>=1.13.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mindlm = "mindlm.main:main"
mindlm-api = "mindlm.api.run:main"
mindlm-mcp = "mindlm.mcp.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindlm"]

[tool.coverage.run]
source = ["src/mindlm"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires live Docker services (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    ".tox",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (needed in tests)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["mindlm"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "fastembed.*",
    "surya.*",
    "fitz.*",
    "docx.*",
    "pptx.*",
    "bs4.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_optional = true

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py311,py312,py313
isolated_build = True

[testenv]
description = Run tests with pytest
package = wheel
wheel_build_env = .pkg
runner = uv-venv-lock-runner
deps =
    pytest>=8.4.2
    pytest-cov>=5.0.0
commands =
    pytest {posargs:tests}

[testenv:coverage]
description = Run tests with coverage report
deps =
    pytest>=8.4.2
    pytest-cov>=5.0.0
commands =
    pytest --cov --cov-report=term-missing --cov-report=html {posargs:tests}

[testenv:lint]
description = Run all pre-commit hooks
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files
"""

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
changelog_incremental = true
