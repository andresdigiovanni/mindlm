llm:
  provider: ollama
  model: gemma4
  base_url: http://ollama:11434

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2
  dimensions: 384

vector_store:
  provider: qdrant
  mode: local
  host: qdrant
  port: 6333
  collection: documents

ingestion:
  source_type:
    - pdf
    - markdown
    - html
    - png
    - jpeg
    - pptx
    - docx
  parsing_strategy: structured
  deduplication: true

chunking:
  strategy: fixed
  chunk_size: 500
  overlap: 50

retrieval:
  strategy: hybrid
  top_k: 5

reranking:
  enabled: false
  method: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

generation:
  provider: ollama
  model: gemma4
  temperature: 0.7
  max_tokens: 1024
