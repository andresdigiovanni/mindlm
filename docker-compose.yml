services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./configs/config.yaml:/config/config.yaml:ro
      - hf_cache:/cache/hf
      # Mount your document directory into the container.
      # Must match ingestion.allowed_base_dir in config.yaml (default: /data).
      # - ./data:/data:ro
    networks:
      - rag_net

  mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - qdrant
      - ollama
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./configs/config.yaml:/config/config.yaml:ro
      - hf_cache:/cache/hf
      # Mount your document directory into the container.
      # Must match ingestion.allowed_base_dir in config.yaml (default: /data).
      # - ./data:/data:ro
    networks:
      - rag_net

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - rag_net

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_net

volumes:
  ollama_models:
  qdrant_data:
  hf_cache:

networks:
  rag_net:
    driver: bridge
