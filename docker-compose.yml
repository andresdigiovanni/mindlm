services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./configs/config.yaml:/config/config.yaml:ro
      - hf_cache:/cache/hf
      # Mount your document directory into the container.
      # Must match ingestion.allowed_base_dir in config.yaml (default: /data).
      # - ./data:/data:ro
    networks:
      - rag_net

  mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    stdin_open: true
    tty: true
    depends_on:
      - qdrant
      - ollama
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./configs/config.yaml:/config/config.yaml:ro
      - hf_cache:/cache/hf
      # Mount your document directory into the container.
      # Must match ingestion.allowed_base_dir in config.yaml (default: /data).
      # - ./data:/data:ro
    networks:
      - rag_net

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - rag_net

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_net

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: changeme-replace-with-a-random-secret  # WARNING: change before production
      NEXTAUTH_URL: http://localhost:3000
      SALT: changeme-replace-with-a-random-salt  # WARNING: change before production
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: my-org
      LANGFUSE_INIT_ORG_NAME: MindLM
      LANGFUSE_INIT_PROJECT_ID: mindlm-project
      LANGFUSE_INIT_PROJECT_NAME: mindlm
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-dev
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: changeme  # WARNING: change before production
    networks:
      - rag_net

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse  # WARNING: change before production
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data
    networks:
      - rag_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
  qdrant_data:
  hf_cache:
  langfuse_postgres:

networks:
  rag_net:
    driver: bridge
